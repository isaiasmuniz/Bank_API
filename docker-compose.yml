services:
  db:
    image: mysql:9.1.0
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: adm123
      MYSQL_ROOT: docker
      MYSQL_PASSWORD: adm123
      MYSQL_DATABASE: bank_db
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - project-network
  bank-Api-restFull:
    image: ilopes5/bank-api-restfull
    restart: always
    build: ./bank-Api-restFull
    working_dir: /bank-Api-restFull
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3306/bank_db?useTimezone=true&serverTimezone=UTC
      SPRING.DATASOURCE.USERNAME: root
      SPRING.DATASOURCE.PASSWORD: adm123
    ports:
      - 80:80
    command: mvn spring-boot:run
    depends_on:
      - db
    networks:
      - project-network
networks:
  project-network:
    driver: bridge